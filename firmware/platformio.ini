[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_eol = CRLF
monitor_echo = yes

; Match the board's USB-serial chip (CP210x or CH9102F) instead of the first
; serial port found, which on macOS is the Bluetooth port.
upload_port = /dev/cu.*usb*
monitor_port = /dev/cu.*usb*
lib_deps =
    vshymanskyy/TinyGSM
    vshymanskyy/StreamDebugger
    bblanchon/ArduinoJson
build_flags =
    -DTINY_GSM_MODEM_SIM7000SSL
    ; Larger RX buffer so +CGNSINF and HTTP responses are not truncated.
    -DTINY_GSM_RX_BUFFER=1024

; HTTP diagnostics build: pio run -e diag -t upload && pio device monitor
[env:diag]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DDIAG_HTTP

; GNSS diagnostics build: pio run -e gnss -t upload && pio device monitor
[env:gnss]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DDIAG_GNSS
